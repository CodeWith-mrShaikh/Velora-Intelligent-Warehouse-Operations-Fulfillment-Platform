version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wis-postgres
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
      POSTGRES_DB: warehouse_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wis-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://warehouse_user:warehouse_pass@postgres:5432/warehouse_inventory?schema=public
      JWT_SECRET: change-this-in-production-to-a-secure-random-string
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wis-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
